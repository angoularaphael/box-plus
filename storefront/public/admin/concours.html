<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin concours — Boxing Center</title>
  <meta http-equiv="Cache-Control" content="no-store" />
  <script src="../js/boot.js"></script>
  <link rel="stylesheet" href="../css/boutique.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <p class="login-subtitle">Ouverture de l’admin concours…</p>
      <p id="msg" class="form-msg" hidden></p>
    </div>
  </div>
  <script>
    (async function () {
      const msg = document.getElementById('msg');
      try {
        const me = await fetch('/api/auth/me', { credentials: 'include' });
        if (!me.ok) {
          location.replace('/admin/login?next=/admin/concours');
          return;
        }
        const res = await fetch('/api/admin/concours-url', { credentials: 'include' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.url) throw new Error(data.error || 'unavailable');
        location.replace(data.url);
      } catch (err) {
        msg.hidden = false;
        msg.classList.add('err');
        msg.textContent = 'Impossible d’ouvrir l’admin concours. Réessaie.';
      }
    })();
  </script>
</body>
</html>
