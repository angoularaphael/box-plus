<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Déclaration médicale | Boxing Center</title>
  <meta name="robots" content="noindex,follow" />
  <script src="/js/boot.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/boutique.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <style>
    .decl-view-body { margin: 0; background: #f5f6f8; min-height: 100vh; display: flex; flex-direction: column; }
    .decl-view-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e7eb;
      position: sticky; top: 0; z-index: 2;
    }
    .decl-view-toolbar h1 { font-size: 16px; color: var(--bc-navy, #0B1F3A); margin: 0; }
    .decl-view-spacer { width: 120px; }
    .decl-view-frame { flex: 1; width: 100%; min-height: calc(100vh - 56px); border: 0; background: #525659; }
    @media (max-width: 640px) {
      .decl-view-spacer { display: none; }
      .decl-view-toolbar { flex-wrap: wrap; justify-content: center; text-align: center; }
    }
  </style>
</head>
<body class="decl-view-body">
  <header class="decl-view-toolbar">
    <span class="decl-view-spacer" aria-hidden="true"></span>
    <h1>Déclaration médicale</h1>
    <a class="btn sm" id="downloadBtn" href="/documents/declaration-medicale.pdf" download="Declaration-medicale-Boxing-Center.pdf">Télécharger le PDF</a>
  </header>
  <iframe id="pdfFrame" class="decl-view-frame" title="Déclaration médicale PDF" src="/documents/declaration-medicale.pdf"></iframe>
</body>
</html>
